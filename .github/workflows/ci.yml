# Checks every pull request: the security-rules tests and a debug build of the app.
# Nothing is published from here.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: rules-test/package-lock.json
      - name: Run rules tests
        working-directory: rules-test
        run: |
          npm ci
          npm test

  app:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug app
        run: bash ./gradlew assembleDebug --stacktrace

  signing:
    name: Signed release build
    runs-on: ubuntu-latest
    # Proves the signing secrets work before anything is merged. Skipped where secrets
    # aren't available (pull requests from forks).
    env:
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
      - uses: actions/setup-java@v4
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
      - name: Restore signing key
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: Build and verify signed bundle
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          bash ./gradlew bundleRelease --stacktrace -Pworkbid.versionCode=1 -Pworkbid.versionName=ci
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee /dev/stderr | grep -q "jar verified"
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep "Owner"
      - name: No signing secrets here
        if: env.UPLOAD_KEYSTORE_BASE64 == ''
        run: echo "Signing secrets aren't available to this run; skipped."
